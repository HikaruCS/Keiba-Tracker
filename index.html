<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keiba Tracker</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <!-- flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/d781539431.js" crossorigin="anonymous"></script>
    <!-- Google Font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
</head>
<body class="gradation">
    <header>
        <h1 class="d-flex justify-content-center pt-3 zen-kurenaido-regular fs-1">Keiba Tracker</h1>
    </header>
    <main>
        <div class="container">
            <div class="row">
                <div class="col-md-6 mt-3">
                    <form id="keiba-form" class="h-100">
                        <div class="form-group mb-2">
                            <input type="text" class="form-control" id="race-date" placeholder="日付を選択" required />
                        </div>
                        <div class="dropdown mb-2">
                            <button class="btn btn-secondary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="race-course">
                            競馬場
                            </button>
                            <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" id="TOK">東京</a></li>
                            <li><a class="dropdown-item" href="#" id="NAK">中山</a></li>
                            <li><a class="dropdown-item" href="#" id="KYO">京都</a></li>
                            <li><a class="dropdown-item" href="#" id="HSN">阪神</a></li>
                            <li><a class="dropdown-item" href="#" id="SAP">札幌</a></li>
                            <li><a class="dropdown-item" href="#" id="HAK">函館</a></li>
                            <li><a class="dropdown-item" href="#" id="FUK">福島</a></li>
                            <li><a class="dropdown-item" href="#" id="NII">新潟</a></li>
                            <li><a class="dropdown-item" href="#" id="CKT">中京</a></li>
                            <li><a class="dropdown-item" href="#" id="KOK">小倉</a></li>
                            </ul>
                        </div>
                        <div class="dropdown mb-2">
                            <button class="btn btn-secondary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="race">
                            レース
                            </button>
                            <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" id="1">1R</a></li>
                            <li><a class="dropdown-item" href="#" id="2">2R</a></li>
                            <li><a class="dropdown-item" href="#" id="3">3R</a></li>
                            <li><a class="dropdown-item" href="#" id="4">4R</a></li>
                            <li><a class="dropdown-item" href="#" id="5">5R</a></li>
                            <li><a class="dropdown-item" href="#" id="6">6R</a></li>
                            <li><a class="dropdown-item" href="#" id="7">7R</a></li>
                            <li><a class="dropdown-item" href="#" id="8">8R</a></li>
                            <li><a class="dropdown-item" href="#" id="9">9R</a></li>
                            <li><a class="dropdown-item" href="#" id="10">10R</a></li>
                            <li><a class="dropdown-item" href="#" id="11">11R</a></li>
                            <li><a class="dropdown-item" href="#" id="12">12R</a></li>
                            </ul>
                        </div>
                        <div class="dropdown mb-2">
                            <button class="btn btn-secondary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="bet-type">
                                券種
                            </button>
                            <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" id="tanshou">単勝</a></li>
                            <li><a class="dropdown-item" href="#" id="fukushou">複勝</a></li>
                            <li><a class="dropdown-item" href="#" id="ouen">応援馬券</a></li>
                            <li><a class="dropdown-item" href="#" id="wakuren">枠連</a></li>
                            <li><a class="dropdown-item" href="#" id="umaren">馬連</a></li>
                            <li><a class="dropdown-item" href="#" id="umatan">馬単</a></li>
                            <li><a class="dropdown-item" href="#" id="wide">ワイド</a></li>
                            <li><a class="dropdown-item" href="#" id="sanrenpuku">3連複</a></li>
                            <li><a class="dropdown-item" href="#" id="sanrentan">3連単</a></li>
                            <li><a class="dropdown-item" href="#" id="win5">WIN5</a></li>
                            </ul>
                        </div>
                        <div class="form-group mb-2">
                            <input type="text" name="bet" placeholder="購入金額" class="form-control" required />
                        </div>
                        <div class="form-group mb-2">
                            <input type="text" name="payoff" placeholder="払戻金額" class="form-control" required />
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="saveButton">保存</button>
                    </form>
                </div>
                <div class="col-md-6 my-3">
                    <div class="card h-100">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center shadow">
                            <h3>回収率</h3>
                            <p id="percentage" class="fs-1"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="table-container" class="mt-5">
            <table class="table">
                <thead>
                    <th scope="col" class="gradation2">日付</th>
                    <th scope="col" class="gradation2">競馬場</th>
                    <th scope="col" class="gradation2">レース</th>
                    <th scope="col" class="gradation2">券種</th>
                    <th scope="col" class="gradation2">購入金額</th>
                    <th scope="col" class="gradation2">払戻金額</th>
                    <th scope="col" class="gradation2"></th>
                </thead>
                <tbody id="record-table" class="">

                </tbody>
            </table>
        </div>
    </main>
    <footer class="d-flex justify-content-center mt-3 gradation">
        &copy; HikaruCS
    </footer>
    
    <script src="app.js"></script>
</body>
</html>
