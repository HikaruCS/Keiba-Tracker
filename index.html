<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keiba Tracker</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <!-- flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="d-flex justify-content-center pt-3">Keiba Tracker</div>
    </header>
    <main>
        <div class="d-flex flex-row px-1">
            <div class="form-group">
                <!-- <label for="race-date">レース日</label> -->
                <input type="text" class="form-control" id="race-date" placeholder="日付を選択">
            </div>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  競馬場
                </button>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">東京</a></li>
                  <li><a class="dropdown-item" href="#">中山</a></li>
                  <li><a class="dropdown-item" href="#">京都</a></li>
                  <li><a class="dropdown-item" href="#">阪神</a></li>
                  <li><a class="dropdown-item" href="#">札幌</a></li>
                  <li><a class="dropdown-item" href="#">函館</a></li>
                  <li><a class="dropdown-item" href="#">福島</a></li>
                  <li><a class="dropdown-item" href="#">新潟</a></li>
                  <li><a class="dropdown-item" href="#">中京</a></li>
                  <li><a class="dropdown-item" href="#">小倉</a></li>
                </ul>
            </div>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  レース
                </button>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">1R</a></li>
                  <li><a class="dropdown-item" href="#">2R</a></li>
                  <li><a class="dropdown-item" href="#">3R</a></li>
                  <li><a class="dropdown-item" href="#">4R</a></li>
                  <li><a class="dropdown-item" href="#">5R</a></li>
                  <li><a class="dropdown-item" href="#">6R</a></li>
                  <li><a class="dropdown-item" href="#">7R</a></li>
                  <li><a class="dropdown-item" href="#">8R</a></li>
                  <li><a class="dropdown-item" href="#">9R</a></li>
                  <li><a class="dropdown-item" href="#">10R</a></li>
                  <li><a class="dropdown-item" href="#">11R</a></li>
                  <li><a class="dropdown-item" href="#">12R</a></li>
                </ul>
              </div>
        </div>
        <div>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    券種
                </button>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">単勝</a></li>
                  <li><a class="dropdown-item" href="#">複勝</a></li>
                  <li><a class="dropdown-item" href="#">応援馬券</a></li>
                  <li><a class="dropdown-item" href="#">枠連</a></li>
                  <li><a class="dropdown-item" href="#">馬連</a></li>
                  <li><a class="dropdown-item" href="#">馬単</a></li>
                  <li><a class="dropdown-item" href="#">ワイド</a></li>
                  <li><a class="dropdown-item" href="#">3連複</a></li>
                  <li><a class="dropdown-item" href="#">3連単</a></li>
                  <li><a class="dropdown-item" href="#">WIN5</a></li>
                </ul>
            </div>
            <form action='#' method='#'>
                <input type="text" name="bet" placeholder="購入金額" size="50" maxlength="30">
            </form>
            <form action='#' method='#'>
                <input type="text" name="return" placeholder="払戻金額" size="50" maxlength="30">
            </form>
        </div>
        <button type="button" class="btn btn-primary">追加</button>
    </main>
    <footer>

    </footer>
    
    <script src="app.js"></script>
</body>
</html>
